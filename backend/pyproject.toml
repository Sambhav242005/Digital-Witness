[project]
name = "digital-witness-backend"
version = "1.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.4",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pillow==12.3.0",
  "google-genai==2.29.0",
  "openai==2.24.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
